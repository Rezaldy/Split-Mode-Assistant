version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      intellij-platform:
        patterns:
          - "org.jetbrains.intellij*"
          - "org.jetbrains.kotlin*"
    ignore:
      # The `rpc` Gradle plugin (settings.gradle.kts) is a JetBrains-internal
      # compiler plugin whose version is coupled to the Kotlin version, and it
      # is only published for the Kotlin versions the modular plugin template
      # uses. Kotlin is bumped by hand together with `rpc` when following the
      # template; Dependabot must not propose it alone (see CLAUDE.md trap 2).
      - dependency-name: "org.jetbrains.kotlin.jvm"
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
      # kotlinx-serialization is compileOnly in frontend/ and must match the
      # version bundled by the IntelliJ Platform (IU-2026.1 ships 1.9.0).
      # It moves only together with intellijPlatformVersion, never alone.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
